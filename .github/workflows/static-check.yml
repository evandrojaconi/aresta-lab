name: Aresta Lab - QA da previa estatica

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Compilar site para GitHub Pages
        run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Conferir rotas e preparar preview
        run: node scripts/verify-static.mjs
      - name: Arquivar previa testada
        uses: actions/upload-artifact@v4
        with:
          name: aresta-lab-preview
          path: .output/public
          retention-days: 14
