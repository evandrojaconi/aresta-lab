name: Aresta Lab - Publicar previa

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aresta-lab-pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar e enviar site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Construir paginas estaticas
        run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Verificar rotas e preparar preview
        run: node scripts/verify-static.mjs
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Publicar apos artefato estar disponivel
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
