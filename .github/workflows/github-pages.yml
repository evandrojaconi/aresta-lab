name: Aresta Lab - Publicar previa

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aresta-lab-pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar Lab e espelho oficial
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar Aresta Lab
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias do laboratorio
        run: bun install --frozen-lockfile
      - name: Gerar paginas do laboratorio
        run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Validar laboratorio
        run: node scripts/verify-static.mjs
      - name: Baixar site oficial em copia temporaria
        uses: actions/checkout@v4
        with:
          repository: aresta-climb/arestaclimb.com
          ref: main
          path: official-source
          persist-credentials: false
      - name: Preparar homologacao sem analytics ou Sentry produtivos
        run: node scripts/prepare-official-preview.mjs
      - name: Instalar dependencias do site oficial
        working-directory: official-source
        run: npm ci
      - name: Gerar build do site oficial
        working-directory: official-source
        run: npm run build
      - name: Montar espelho no GitHub Pages
        run: node scripts/finalize-official-preview.mjs
      - name: Gerar proposta V2 e blog
        run: node scripts/build-v2.mjs
      - name: Enviar Lab e espelho oficial
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Publicar apos build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
