name: Aresta Lab - Publicar previa

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aresta-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Construir paginas estaticas
        run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Verificar rotas, links e preparar preview
        run: node scripts/verify-static.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
