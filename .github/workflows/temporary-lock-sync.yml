name: Temporary Bun lock sync

on:
  push:
    branches: ["chore/github-only-pages-2026-11"]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/github-only-pages-2026-11
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Commit updated lockfile on the feature branch
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "build: atualizar bun.lock após remover dependência Lovable"
            git push origin HEAD:chore/github-only-pages-2026-11
          fi
