name: Aresta Lab - Validar espelho oficial

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          GITHUB_PAGES: "true"
      - run: node scripts/verify-static.mjs
      - uses: actions/checkout@v4
        with:
          repository: aresta-climb/arestaclimb.com
          ref: main
          path: official-source
          persist-credentials: false
      - run: node scripts/prepare-official-preview.mjs
      - run: npm ci
        working-directory: official-source
      - run: npm run build
        working-directory: official-source
      - run: node scripts/finalize-official-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aresta-lab-espelho-oficial
          path: .output/public/oficial/
          retention-days: 7
