function login(id){personaSelected=null;S.current=id;flash('Perfil de demonstração selecionado.')}function logout(){personaSelected=null;S.current=null;flash('Sessão local encerrada.')}function saveProfile(){let u=U();if(!u)return;u.aff=$('#aff').value;u.support=$('#support').checked;flash('Preferências salvas. Vínculos não são retroativos.')}
function calcEntity(ent){let bucket=cycle(S.date,ent.cycle),acts=S.actions.filter(a=>active(a)&&cycle(a.validatedAt,ent.cycle)===bucket);let own=acts.filter(a=>a.entity===ent.id).reduce((s,a)=>s+a.weight,0);let inherited=0;if(ent.cycle===3)inherited=acts.filter(a=>!a.entity&&a.origin===ent.id).reduce((s,a)=>s+a.weight,0)*ent.rate;else{let children=entities.filter(x=>x.parent===ent.id).map(x=>x.id);inherited=S.closes.filter(c=>children.includes(c.entity)&&c.unlocked&&cycle(c.date,ent.cycle)===bucket).reduce((s,c)=>s+c.total,0)*ent.rate}let ok=S.okrs.some(o=>o.entity===ent.id&&o.status==='validado'&&cycle(o.validatedAt,ent.cycle)===bucket);return{bucket,own,inherited,ok,total:own+(ok?inherited:0)}}
function network(){return head('Governança federativa','Rede de contribuição','CBME → FEMEMG → associações locais; pessoas e curadores independentes se conectam ao território sem filiação compulsória.')+`<div class="grid three">${entities.filter(e=>e.id!=='global').map(e=>{let c=calcEntity(e);return card(e.name,`<p class="muted">${e.scope} · ${e.cycle} meses · peso ${e.weight}</p><div class="stat">${c.total.toFixed(1)} pts</div><p>Próprios: ${c.own} · cofre: ${c.inherited.toFixed(1)}</p>${tag(c.ok?'OKR próprio validado':'Cofre bloqueado',c.ok?'ok':'neutral')}<p class="muted">${c.bucket} · herança ${Math.round(e.rate*100)}% · sinergia proposta ${e.mult}×</p><p class="muted">Cenário com sinergia: ${(c.total*e.mult).toFixed(1)} pts coletivos (não aplicado ao saldo)</p>`)}).join('')}</div><div class="grid">${card('Impacto anfitrião',Object.entries(T).map(([id,t])=>`<div class="item row between"><span>${t.name}</span><b>${S.actions.filter(a=>active(a)&&a.territory===id).length} entregas</b></div>`).join(''))}${card('Crédito de origem',`<p>Independente: ${S.actions.filter(a=>active(a)&&a.origin==='solo').reduce((s,a)=>s+a.weight,0)} XP histórico</p><p>Vínculo local: ${S.actions.filter(a=>active(a)&&a.origin==='local').reduce((s,a)=>s+a.weight,0)} XP histórico</p><p class="muted">Uma entrega, dois recortes, sem duplicar impacto físico.</p>`)}</div><div class="notice">A rede global (peso 8, ciclo olímpico) é visão futura. A visibilidade agregada não dá acesso a dados pessoais nem poder legal. Uma ação tem um ID: impacto anfitrião e crédito de origem são dimensões distintas.</div><div class="grid">${card('Autonomia territorial',`<p>Contribuidores independentes podem solicitar curadoria ou mantenedoria, sem precisar se filiar.</p><form id="request"><label>Responsabilidade desejada</label><select name="role"><option value="curador">Curadoria</option><option value="mantenedor">Mantenedoria</option><option value="autonomia">Gestão autônoma do território</option></select><label>Evidência de competência / concordância local</label><textarea name="evidence" required></textarea><label><input type="checkbox" name="support"> Solicitar apoio federativo (opcional)</label><button class="primary" ${!U()||xp()<3?'disabled':''}>Solicitar revisão</button></form>${S.requests.filter(r=>r.territory===S.territory).map(r=>`<div class="item"><b>${E(userName(r.author))} · ${E(r.role)}</b> ${tag(r.status)}<p>${E(r.evidence)}</p>${canReview(r.territory)&&r.author!==S.current&&r.status==='pendente'?`<button onclick="openApproval('${localFor(r.territory)}')">Revisar solicitação</button>`:''}</div>`).join('')}`)}${card('OKR próprio de uma entidade',`<form id="okr"><label>Entidade representada (perfil demo)</label><input disabled value="${E(entities.find(e=>e.id===U()?.entity)?.name||'Sem representação')}"><label>Entrega verificável</label><textarea name="text" required></textarea><label>Evidência</label><input name="evidence" required><button class="primary" ${!U()?.entity?'disabled':''}>Submeter OKR próprio</button></form>${S.okrs.map(o=>`<div class="item"><b>${E(entities.find(e=>e.id===o.entity)?.name)}</b> ${tag(o.status)}<p>${E(o.text)}</p><p class="muted">${E(o.evidence)}</p>${canEntityReview(o.entity,o.author)&&o.status==='pendente'?`<button onclick="openApproval('${o.entity}')">Abrir aprovação institucional</button>`:''}</div>`).join('')}`)}</div><div class="grid">${card('Ações de articulação',recordForm('rede'))}${opinion('rede')}</div>${card('Fechamento demonstrativo',`<p class="muted">O ciclo pode ser encerrado apenas depois de sua data final. O cofre não liberado expira; histórico continua auditável. Nenhum ponto é dinheiro.</p><label>Data simulada</label><input id="simdate" type="date" value="${S.date}" min="2027-01-01"><button onclick="advance()">Avançar data e fechar ciclos</button>${S.closes.map(c=>`<div class="item">${E(c.entity)} · ${E(c.bucket)} · ${c.total.toFixed(1)} pts · ${c.unlocked?'cofre liberado':'cofre expirado'}</div>`).join('')}`)}`}
function verifyOKR(id){let o=S.okrs.find(x=>x.id===id);if(!o||!canEntityReview(o.entity,o.author)||o.status!=='pendente')return;o.status='validado';o.validatedAt=S.date;o.reviewer=S.current;log('OKR validado',id);flash('OKR próprio validado na simulação.')}function grant(id){let r=S.requests.find(x=>x.id===id);if(!r||!canReview(r.territory)||r.author===S.current||r.status!=='pendente')return;r.status='papel local simulado';r.reviewer=S.current;let person=S.users.find(u=>u.id===r.author);if(person){person.scopes=person.scopes||[];if(!person.scopes.some(v=>v.territory===r.territory&&v.role===r.role))person.scopes.push({territory:r.territory,role:r.role});}log('papel territorial simulado',id);flash('Papel local liberado na demonstração; nenhuma autorização formal concedida.')}function advance(){let d=$('#simdate').value;if(!d||d<S.date)return flash('Escolha data igual ou posterior.');let old=S.date;let [y,m]=old.split('-').map(Number),end=d.slice(0,7);while(`${y}-${String(m).padStart(2,'0')}`<end){let closing=`${y}-${String(m).padStart(2,'0')}-${new Date(y,m,0).getDate()}`;let next=m===12?`${y+1}-01-01`:`${y}-${String(m+1).padStart(2,'0')}-01`;S.date=closing;for(let e of [...entities].sort((a,b)=>a.cycle-b.cycle)){if(cycle(closing,e.cycle)!==cycle(next,e.cycle)){let c=calcEntity(e);if(!S.closes.some(x=>x.entity===e.id&&x.bucket===c.bucket))S.closes.push({entity:e.id,bucket:c.bucket,date:closing,total:c.total,unlocked:c.ok,expired:c.ok?0:c.inherited})}}if(++m===13){m=1;y++}}S.date=d;log('ciclo',old+' → '+d);flash('Data avançada. Saldo mensal recalculado; histórico preservado.')}
function finances(){let ins=S.ledger.filter(x=>x.type==='entrada').reduce((s,x)=>s+x.value,0),outs=S.ledger.filter(x=>x.type==='saida').reduce((s,x)=>s+x.value,0);return head('Central de investimentos','Economia e transparência','Recursos públicos e privados contratados para pesquisa, tecnologia e ações territoriais. Livro meramente demonstrativo.')+`<div class="grid three">${stat(money(ins),'Entradas simuladas')}${stat(money(outs),'Saídas simuladas')}${stat(money(ins-outs),'Saldo simulado')}</div><div class="grid">${card('Fluxo econômico',`<div class="stack"><div class="step">Empresas · governos · proprietários</div><div class="step">Aresta: captação, operação, pesquisa</div><div class="step">CBME → federações → associações → execução local</div><div class="step">Via direta a território independente quando elegível</div><div class="step">Evidências · relatórios · reinvestimento</div></div><p class="muted">Repasses condicionados a contratos, elegibilidade e entregas. Não existe conversão automática de XP em reais.</p>`)}${card('Registrar movimentação (demo)',`<form id="ledger"><label>Tipo</label><select name="type"><option value="entrada">Entrada</option><option value="saida">Repasse ou custo</option></select><label>Origem/destino institucional (fictício)</label><input name="party" required><label>Objeto / referência contratual</label><input name="purpose" required><label>Valor</label><input name="value" type="number" min="0.01" step="0.01" required><button class="primary" ${!U()?.entity?'disabled':''}>Registrar simulação</button></form>` )}</div>${card('Livro público de demonstração',`<div class="table"><table><thead><tr><th>Data</th><th>Tipo</th><th>Parte</th><th>Finalidade</th><th>Valor</th></tr></thead><tbody>${S.ledger.map(l=>`<tr><td>${l.date}</td><td>${E(l.type)}</td><td>${E(l.party)}</td><td>${E(l.purpose)}</td><td>${money(l.value)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="grid">${card('Remuneração dos quatro sócios',`<p>Proposta: piso igualitário de 25% do orçamento específico de remuneração dos sócios, não de toda a captação. Custos, impostos e recursos vinculados ficam separados.</p><p>Bônus variável por entrega validada e continuidade: parâmetros sujeitos à aprovação societária.</p>`)}${card('Investidores',`<p>Fibonacci lenta: 0,1 · 0,1 · 0,2 · 0,3 · 0,5. Impacto: 1 · 1 · 2 · 3 · 5.</p><p class="muted">Índices de cenário, não taxas de ROI, promessa de rendimento ou oferta pública. Retorno depende de instrumento jurídico e caixa real. Investir não compra voto ou controle.</p>`)}</div>${opinion('investimentos')}`}

let panelScope='local',panelFilter='pendente';
const entityBy=id=>entities.find(e=>e.id===id);
const canEntityReview=(id,author)=>!!U()&&U().id!==author&&U().entity===id;
const institutionTypes=[['cooperacao','Termo de cooperação / apoio'],['diretriz','Diretriz / comunicado institucional'],['projeto','Projeto territorial / pesquisa'],['representacao','Vínculo e representação institucional'],['contas','Prestação de contas / evidência de execução']];
function openApproval(id){panelScope=entityBy(id)?id:localFor(S.territory);panelFilter='pendente';navigate('aprovacoes')}
function selectPanel(id){if(!entityBy(id)||id==='global')return;panelScope=id;panelFilter='pendente';render()}
function setPanelFilter(v){panelFilter=v;render()}
function isScopeTerritory(id,t){return entityBy(id)?.cycle!==3||entityBy(id)?.scope===t}
function responsibility(u=U(),t=S.territory){if(!u)return 'visitante';let e=entityBy(u.entity);if(e?.cycle===12)return 'confederacao';if(e?.cycle===6)return 'federacao';if(e?.cycle===3&&e.scope===t)return 'associacao';let roles=(u.scopes||[]).filter(r=>r.territory===t).map(r=>r.role);if(u.id==='peer'&&t==='lapinha')roles.push('mantenedor');if(roles.some(r=>['mantenedor','autonomia'].includes(r)))return 'mantenedor';if(roles.includes('curador'))return 'curador';return 'escalador'}
function targetChoices(){let u=U();if(!u)return [];let role=responsibility(u),e=entityBy(u.entity),local=entityBy(localFor(S.territory));if(role==='confederacao')return [e];if(role==='federacao')return [e,entityBy(e.parent)].filter(Boolean);if(role==='associacao')return [e,entityBy(e.parent)].filter(Boolean);if(role==='mantenedor')return [local,entityBy(local?.parent)].filter(Boolean);if(role==='curador')return [local].filter(Boolean);return []}
function submitInstitutionCase(v){let u=U(),e=entityBy(v.target);if(!u||!e||!targetChoices().some(x=>x.id===e.id)||!institutionTypes.some(x=>x[0]===v.type)||!v.title?.trim()||!v.evidence?.trim())return false;if(!isScopeTerritory(e.id,S.territory))return false;if(S.cases.filter(c=>c.author===u.id&&c.target===e.id&&month(c.date)===month(S.date)).length>=maxActions())return false;S.cases.push({id:uid(),author:u.id,origin:u.entity||u.aff,submittedAs:responsibility(u),target:e.id,territory:S.territory,type:v.type,title:v.title.trim(),evidence:v.evidence.trim(),status:'pendente',date:S.date});log('protocolo institucional',e.id+' · '+v.title.trim());return true}
function queueFor(id){let e=entityBy(id);if(!e)return [];let result=S.cases.filter(x=>x.target===id).map(x=>({...x,source:'case',label:institutionTypes.find(t=>t[0]===x.type)?.[1]||x.type,detail:x.title}));result.push(...S.okrs.filter(x=>x.entity===id).map(x=>({...x,source:'okr',label:'OKR próprio',detail:x.text})));if(e.cycle===3){result.push(...S.actions.filter(x=>localFor(x.territory)===id).map(x=>({...x,source:'action',label:kinds.find(k=>k[0]===x.kind)?.[2]||x.kind,detail:x.description})),...S.requests.filter(x=>localFor(x.territory)===id).map(x=>({...x,source:'request',label:'Responsabilidade territorial',detail:x.role})),...S.events.filter(x=>localFor(x.territory)===id).map(x=>({...x,source:'event',label:'Comunicado / evento',detail:x.title,evidence:x.text})));}return result.sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id))}
function allowedDecision(id,c){if(!c||c.status!=='pendente'||!U()||c.author===S.current)return false;return ['case','okr'].includes(c.source)?canEntityReview(id,c.author):canReview(c.territory)&&localFor(c.territory)===id}
function decideInstitution(id,source,yes,reason){let c=queueFor(panelScope).find(x=>x.id===id&&x.source===source);if(!allowedDecision(panelScope,c)||!reason?.trim())return false;let target={case:S.cases,okr:S.okrs,action:S.actions,request:S.requests,event:S.events}[source].find(x=>x.id===id);if(source==='action'&&yes&&S.actions.some(x=>active(x)&&x.id!==id&&x.territory===target.territory&&x.kind===target.kind&&x.evidence.trim().toLowerCase()===target.evidence.trim().toLowerCase()))return false;if(source==='action'&&yes&&target.publish&&!ready(S.drafts.find(x=>x.id===target.draft)))return false;target.reason=reason.trim();target.reviewer=S.current;target.validatedAt=S.date;target.status=yes?'validado':'rejeitado';if(source==='action'){let d=S.drafts.find(x=>x.id===target.draft);if(d)d.status=yes?(target.publish?'publicado na demo':'rascunho revisado'):'rascunho'}if(source==='request'&&yes){let person=S.users.find(u=>u.id===target.author);if(person){person.scopes ||= [];if(!person.scopes.some(v=>v.territory===target.territory&&v.role===target.role))person.scopes.push({territory:target.territory,role:target.role})}target.status='papel local simulado'}log('decisão institucional',panelScope+' · '+source+' · '+id+' · '+target.status+' · '+reason.trim());save();return true}
function decideFromUI(id,source,yes){let reason=$('#reason-'+id)?.value;if(!decideInstitution(id,source,yes,reason))return flash('Decisão não registrada. Confira o escopo, a independência do revisor, a evidência e a justificativa.');flash('Decisão registrada no histórico. Nenhum efeito jurídico ou financeiro real.')}
function approvalRow(c){let decision=allowedDecision(panelScope,c);return `<article class="review-case"><div class="row between"><div class="label approval-kicker">${E(c.label)}</div>${tag(c.status,c.status==='validado'?'ok':'neutral')}</div><h3>${E(c.detail)}</h3><p class="muted">${E(userName(c.author))} · ${E(T[c.territory]?.name||entityBy(c.entity)?.name||'Esfera institucional')} · ${E(c.date)}</p><p><b>Evidência:</b> ${E(c.evidence||'Sem evidência adicional')}</p>${c.reviewer?`<p class="muted">Revisão: ${E(userName(c.reviewer))} · ${E(c.reason||'Decisão anterior ao painel')}</p>`:''}${decision?`<label for="reason-${c.id}">Justificativa pública da decisão</label><textarea id="reason-${c.id}" maxlength="500" placeholder="Indique evidência, critérios ou ajustes necessários"></textarea><div class="review-actions"><button class="primary" onclick="decideFromUI('${c.id}','${c.source}',true)">Aprovar</button><button onclick="decideFromUI('${c.id}','${c.source}',false)">Rejeitar / devolver</button></div>`:'<p class="muted">Leitura pública · decisão reservada a um revisor elegível e distinto do autor.</p>'}</article>`}
function proposalPanel(){let targets=targetChoices();if(!targets.length)return '<div class="next-action"><h3>Comece pelo território</h3><p>Corrija croquis, registre observações, sugira melhorias e participe de ações locais. Mantenedores validados e associações podem encaminhar propostas à federação. Filiação é opcional.</p><div class="row"><button class="primary" onclick="navigate(\'participar\')">Como contribuir</button><button onclick="navigate(\'publico\',\'painel\',\'territorio\')">Sugerir melhoria local</button></div></div>';return '<p>Destinos disponíveis conforme sua responsabilidade validada. XP não concede representação institucional.</p><form id="institutionCase"><label>Destino</label><select name="target" required>'+targets.map(x=>'<option value="'+x.id+'">'+E(x.name)+'</option>').join('')+'</select><label>Tipo</label><select name="type">'+institutionTypes.map(([k,l])=>'<option value="'+k+'">'+E(l)+'</option>').join('')+'</select><label>Título</label><input name="title" required maxlength="150"><label>Evidência / referência</label><textarea name="evidence" required maxlength="800"></textarea><button class="primary">Enviar para aprovação</button></form><p class="muted">A aprovação não autoriza obra, acesso, pagamento ou filiação formal.</p>'}
function approvals(){let e=entityBy(panelScope)||entityBy('local'),all=queueFor(e.id),filtered=all.filter(c=>panelFilter==='todos'||(panelFilter==='decididos'?c.status!=='pendente':c.status==='pendente')),v=calcEntity(e);return head('Gestão colaborativa / decisões rastreáveis','Central de aprovações','Uma fila por entidade, escopo local preservado e decisões motivadas. Nenhum cargo atribui XP individual extra.')+`<div class="scopebar">${entities.filter(x=>x.id!=='global').map(x=>`<button class="${x.id===e.id?'active':''}" onclick="selectPanel('${x.id}')">${E(x.name)}</button>`).join('')}</div><div class="hero"><div class="label">${e.cycle===3?'Local · associação ou curadoria':e.cycle===6?'Estadual · federação':'Nacional · confederação'}</div><h2>${E(e.name)}</h2><p>${e.cycle===3?'Revisão de croquis, solicitações de autonomia, comunicados, projetos, ações e evidências do território.':e.cycle===6?'Articulação estadual, pedidos de apoio, cooperação, diretrizes regionais, projetos e OKRs próprios.':'Diretrizes nacionais, articulação interestadual, cooperação, prestação de contas e OKRs próprios.'}</p><p class="muted">${U()?.entity===e.id?'Perfil vinculado a esta esfera na demonstração.':'Leitura aberta. Para aprovar, entre com um perfil de revisão autorizado nesta esfera.'} A filiação não é compulsória; apoio federativo pode ser solicitado.</p></div><div class="grid four">${stat(all.filter(c=>c.status==='pendente').length,'Pendências')}${stat(all.filter(c=>['validado','papel local simulado'].includes(c.status)).length,'Aprovados')}${stat(all.filter(c=>c.status==='rejeitado').length,'Devolvidos')}${stat(v.total.toFixed(1),'Pontos liberados no ciclo')}</div><div class="grid">${card('Fila institucional',`<div class="tabs">${[['pendente','Pendentes'],['decididos','Decididos'],['todos','Todos']].map(([k,l])=>`<button class="${panelFilter===k?'active':''}" onclick="setPanelFilter('${k}')">${l}</button>`).join('')}</div>${filtered.map(approvalRow).join('')||empty}`)}${card(tar pedra:{region:'Pedra Grande · Igarapé, MG',nature:'As regras do croqui Igarameca orientam preservar animais locais e vegetação nativa.',fauna:'Inventário específico ainda não validado neste LAB. Observe animais à distância e não leve animais domésticos, conforme a orientação local.',rules:'Use trilhas principais, retire o lixo, evite fogueiras, não bloqueie circulação e consulte a equipe local antes de abrir vias.',sources:[['ArestaDB · regras do Igarameca',dbSource+'br_mg_igarape_pedra_grande/regras.md']]},
pedreira:{region:'Pedreira Dr. Gravatá · Betim, MG',nature:'O croqui descreve área urbana alterada, com remanescentes e características de Mata Atlântica em transição com Cerrado.',fauna:'Inventário de espécies pendente. Não perturbe ninhos, colmeias ou abrigos; escolha outra via se houver conflito com a fauna.',rules:'Não altere agarras, vegetação ou proteções. Atenção a blocos soltos, fraturas, áreas fechadas e entradas sem autorização.',sources:[['ArestaDB · conduta e mínimo impacto',dbSource+'br_mg_betim_pedreira_dr_gravata/conduta_seguranca_e_minimo_impacto.md'],['ArestaDB · como chegar',dbSource+'br_mg_betim_pedreira_dr_gravata/como_chegar.md']]}
};
const weatherCache={},weatherPending=new Set(),weatherError={};
function weatherUrl(id){let [lat,lon]=cityCenters[id];return 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max,sunrise,sunset&timezone=America%2FSao_Paulo&forecast_days=3'}
function finiteVal(v,unit=''){return typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:1})+unit:'—'}
function weatherMarkup(id){let entry=weatherCache[id],d=entry?.data,c=d?.current,days=d?.daily;let refresh='<button type="button" onclick="loadWeather(\''+id+'\',true)">Atualizar previsão</button>';if(!c)return '<p class="muted" role="status">'+E(weatherError[id]||'Consultando previsão regional…')+'</p>'+refresh;let stale=Date.now()-entry.fetched>900000;let cell=(l,v)=>'<div class="weather-cell"><small>'+l+'</small><b>'+E(v)+'</b></div>';let list=Array.isArray(days?.time)?days.time.slice(0,3).map((date,i)=>'<div class="weather-day"><b>'+E(date.split('-').reverse().join('/'))+'</b><p>'+E(finiteVal(days.temperature_2m_min?.[i],'°')+' – '+finiteVal(days.temperature_2m_max?.[i],'°C'))+'</p><p>Chuva: '+E(finiteVal(days.precipitation_probability_max?.[i],'%')+' · '+finiteVal(days.precipitation_sum?.[i],' mm'))+'</p><p>Rajadas: '+E(finiteVal(days.wind_gusts_10m_max?.[i],' km/h'))+'</p><p>Sol: '+E(days.sunrise?.[i]?.slice(11,16)||'—')+' – '+E(days.sunset?.[i]?.slice(11,16)||'—')+'</p></div>').join(''):'';return '<div class="row between">'+tag(stale||weatherError[id]?'Consulta anterior':'Estimativa regional')+(c.weather_code>=95?tag('Trovoadas no modelo'):'')+'</div><div class="weather-grid">'+cell('Temperatura',finiteVal(c.temperature_2m,'°C'))+cell('Umidade',finiteVal(c.relative_humidity_2m,'%'))+cell('Precipitação',finiteVal(c.precipitation,' mm'))+cell('Vento / rajadas',finiteVal(c.wind_speed_10m,' / ')+finiteVal(c.wind_gusts_10m,' km/h'))+'</div><details class="stage"><summary>Próximos 3 dias · chuva, vento e luz do dia</summary><div class="weather-days">'+list+'</div></details><p class="source-note">Open-Meteo · horário do modelo: '+E(c.time||'não informado')+' · consulta: '+E(new Date(entry.fetched).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}))+(weatherError[id]?' · atualização indisponível':'')+'</p>'+refresh}
function refreshWeather(id){if(!document.querySelectorAll)return;for(let node of document.querySelectorAll('[data-weather="'+id+'"]'))node.innerHTML=weatherMarkup(id)}
async function loadWeather(id,force=false){if(!T[id]||weatherPending.has(id))return;if(!force&&((weatherCache[id]&&Date.now()-weatherCache[id].fetched<900000)||weatherError[id]))return;if(typeof fetch!=='function'){weatherError[id]='Previsão indisponível neste ambiente.';refreshWeather(id);return}weatherPending.add(id);try{const r=await fetch(weatherUrl(id),{cache:'no-store',signal:typeof AbortSignal!=='undefined'&&AbortSignal.timeout?AbortSignal.timeout(10000):undefined});if(!r.ok)throw Error('HTTP');let data=await r.json();if(!data.current||!Number.isFinite(data.current.temperature_2m)||!data.current.time)throw Error('invalid');weatherCache[id]={data,fetched:Date.now()};delete weatherError[id]}catch{weatherError[id]='Não foi possível atualizar. Consulte o INMET e tente novamente.'}finally{weatherPending.delete(id);refreshWeather(id)}}
function mountWeather(){if(!document.querySelectorAll)return;for(const node of document.querySelectorAll('[data-weather]'))loadWeather(node.dataset.weather)}
function weatherPanel(){let id=S.territory;return '<section class="weather-panel"><div class="row between"><h2>Tempo agora · '+E(T[id].city)+'</h2><span class="tag">Regional</span></div><div data-weather="'+id+'">'+weatherMarkup(id)+'</div><p class="source-note">Modelo regional em coordenadas aproximadas do município, não da parede. Não determina segurança ou condição da rocha. <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://alertas2.inmet.gov.br/" target="_blank" rel="noopener">Alertas INMET</a>. Em tempestades ou condições desfavoráveis, adie a atividade. API gratuita em LAB não comercial.</p></section>'}
function guidePage(){let g=localGuide[S.territory];return head('Território · consulta livre','Antes de escalar',g.region)+weatherPanel()+'<div class="guide-facts">'+card('Clima e sazonalidade','<p>Clima é o padrão de longo prazo, não a previsão de hoje. Normais locais e microclima da parede ainda não foram importados.</p><a href="https://portal.inmet.gov.br/normais" target="_blank" rel="noopener">Normais climatológicas do INMET</a><p class="muted">Registre sol, sombra e umidade com período e referência.</p>')+card('Fauna e flora','<p>'+E(g.nature)+'</p><p>'+E(g.fauna)+'</p><p class="muted">Não divulgue localização de espécies sensíveis, ninhos ou abrigos. Não remova espécies por conta própria.</p>')+card('Acesso e localidade','<p>'+E(g.region)+'</p><p>'+E(g.rules)+'</p><p class="muted">Confirme autorizações e regras atualizadas. SAMU 192 · Bombeiros 193.</p>')+card('Como contribuir','<p>Registre observações sem interferir na fauna, informe mudanças de acesso e complemente o croqui.</p><div class="row"><button class="primary" onclick="navigate(\'pesquisa\')">Registrar observação</button><button onclick="navigate(\'editor\')">Atualizar croqui</button></div>')+'</div><div class="section-title"><h2>Fontes do território</h2></div>'+g.sources.map(([l,url])=>'<p><a href="'+url+'" target="_blank" rel="noopener">'+E(l)+'</a></p>').join('')+'<p class="source-note">Referências documentais não equivalem a levantamento atual de campo ou autorização de acesso.</p>'}
function editorContext(d){let g=localGuide[S.territory],v=d?.territorialContext||{},editable=d&&d.author===S.current&&d.status==='rascunho';let field=(n,l)=>'<label>'+l+'</label><textarea name="'+n+'" maxlength="800" '+(editable?'':'disabled')+'>'+E(v[n]||'')+'</textarea>';return '<details class="stage"><summary>Contexto do território · tempo, fauna, acesso e sazonalidade</summary>'+weatherPanel()+'<p>'+E(g.rules)+'</p><p>'+E(g.fauna)+'</p><button type="button" onclick="navigate(\'guia\',\'painel\',\'territorio\')">Consultar guia e fontes</button>'+(d?'<form id="territorialContext" class="context-form"><p class="muted">Registre informações estáveis e não sensíveis para revisão; previsão não é característica permanente do croqui.</p>'+field('clima','Exposição, sombra e sazonalidade')+field('fauna','Orientações ambientais e fauna (sem localização sensível)')+field('acesso','Acesso e conduta local')+'<label>Fonte, autoria e data</label><input name="fonte" maxlength="300" required value="'+E(v.fonte||'')+'" '+(editable?'':'disabled')+'><button class="primary" '+(editable?'':'disabled')+'>Salvar contexto no rascunho</button></form>':'<p>Crie um rascunho para registrar contexto.</p>')+'</details>'}
function saveTerritorialContext(v){let d=selectedDraft();if(!d||d.author!==S.current||d.status!=='rascunho'||!String(v.fonte||'').trim())return false;d.territorialContext={clima:String(v.clima||'').trim().slice(0,800),fauna:String(v.fauna||'').trim().slice(0,800),acesso:String(v.acesso||'').trim().slice(0,800),fonte:String(v.fonte).trim().slice(0,300),updatedAt:new Date().toISOString()};save();return true}

function homePage(){return head('Aresta Intelligence','Conhecimento que vira cuidado.')+peakHero()+weatherPanel()+'<div class="row"><button class="primary" onclick="navigate(\'guia\',\'painel\',\'territorio\')">Antes de escalar · clima, fauna e acesso</button><button onclick="showEcosystem()">Conheça o Aresta</button></div>'+publicNotices()+nextContribution()+'<div class="section-title row between"><h2>Impacto no pico</h2><button onclick="navigate(\'impacto\')">Ver impacto</button></div>'+impactOverview(false)+peakPicker()+'<details class="stage"><summary>Indicadores históricos do Aresta · 11/09–25/11/2026</summary><div class="grid mini-stats">'+stat('628','Escaladores ativos')+stat('13.046','Consultas a escaladas')+stat('2.910','Aberturas de croquis')+stat('3.870','Visualizações de setores')+'</div></details>'}
function convertChoices(){if(!document.querySelectorAll||!document.createElement)return;for(let sel of document.querySelectorAll('main select')){if(sel.hidden)continue;let group=document.createElement('div');group.className='choice-group';group.setAttribute('role','group');let label=sel.previousElementSibling;group.setAttribute('aria-label',label?.textContent||sel.getAttribute('aria-label')||sel.name||'Escolher opção');let opts=Array.from(sel.options),buttons=[];function sync(){buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(sel.selectedIndex===i)))}opts.forEach((opt,i)=>{let b=document.createElement('button');b.type='button';b.textContent=opt.textContent;b.disabled=sel.disabled||opt.disabled;b.addEventListener('click',()=>{sel.selectedIndex=i;sync();sel.dispatchEvent(new Event('change',{bubbles:true}))});buttons.push(b);group.appendChild(b)});sel.hidden=true;sel.after(group);sync()}}
function foldSecondary(){if(!document.querySelectorAll||!document.createElement)return;let names={'rede':['Impacto anfitrião','Crédito de origem','Ações de articulação','Fechamento demonstrativo'],'aprovacoes':['Protocolar proposta'],'investimentos':['Fluxo econômico','Registrar movimentação (demo)','Remuneração dos quatro sócios','Investidores'],'relatorios':['Dimensões de impacto','Trilha de auditoria (local)'],'perfil':['Meu histórico'],'publico':['Comunicados e eventos'],'editor':['Revisão por pares']}[page]||[];for(let c of document.querySelectorAll('main .card')){let h=c.querySelector('h2');if(!h||!names.includes(h.textContent))continue;let button=document.createElement('button'),body=document.createElement('div');button.type='button';button.className='fold-toggle';button.setAttribute('aria-expanded','false');button.textContent=h.textContent+' +';body.className='fold-body';body.hidden=true;while(h.nextSibling)body.appendChild(h.nextSibling);let title=h.textContent;h.replaceWith(button);c.appendChild(body);button.addEventListener('click',()=>{body.hidden=!body.hidden;button.setAttribute('aria-expanded',String(!body.hidden));button.textContent=title+(body.hidden?' +':' −')})}}

function render(){applyTheme();let t=territory(),u=U(),body='';if(page==='home')body=homePage();else if(['territorio','colaboracao','transparencia','impacto'].includes(page))body=hubPage(page);
else if(page==='ecossistema')body=ecosystemPage();else if(page==='guia')body=guidePage();else if(page==='participar')body=participationPage();else if(page==='aprovacoes')body=approvals();else if(page==='perfil')body=profile();else if(page==='editor')body=editor();else if(page==='rede')body=network();else if(page==='investimentos')body=finances();else if(page==='publico')body=head('Consulta livre · sem XP',t.name,t.city)+`<div class="hero"><h2>Escalar com autonomia.</h2><p>Dados, acesso e orientações disponíveis independentemente de cadastro ou contribuição.</p><button class="primary" onclick="navigate('guia','painel','territorio')">Consultar tempo, fauna e orientações</button></div><div class="grid">${card('Estado territorial',t.facts.map(x=>`<div class="item">${E(x)}</div>`).join('')+'<p class="muted">Cadastro e vistorias não equivalem a autorização ou garantia de segurança. Confirme as regras com o gestor competente.</p>')}${card('Croquis',S.drafts.filter(d=>d.territory===S.territory&&d.status==='publicado na demo').map(d=>`<div class="item"><b>${E(d.name)}</b> ${tag('publicação fictícia')}<p>${E(d.route)} · ${E(d.grade)}</p></div>`).join('')||'<p>Catálogo oficial externo: <a href="https://arestaclimb.com" target="_blank" rel="noopener">Aresta Climb</a>. Sem croquis reais importados neste ambiente.</p>')}</div>${card('Comunicados e eventos',S.events.filter(x=>x.territory===S.territory&&x.status==='validado').map(x=>`<div class="item"><b>${E(x.title)}</b><p>${E(x.text)}</p></div>`).join('')||empty)}${opinion('territorio')}`;
else if(page==='pesquisa'||page==='projetos')body=head('Trabalho de campo',page==='pesquisa'?'Pesquisa e conservação':'Projetos e ações','O relato é hipótese ou evidência de atividade; a conclusão ambiental depende de protocolo técnico.')+`<div class="grid">${card('Registrar contribuição',recordForm(page))}${card('Entregas e revisão',currentActions().filter(a=>a.menu===page).map(actionRow).join('')||empty)}</div>${opinion(page)}`;
else if(page==='comunidade')body=head('Comunicação aberta','Comunicados e eventos','As entidades e mantenedores atuam conforme seus escopos e autorização.')+`<div class="grid">${card('Propor comunicado',`<form id="event"><label>Título</label><input required name="title"><label>Mensagem</label><textarea name="text" required></textarea><button class="primary" ${!U()||countOpinion('comunidade')>=maxActions()?'disabled':''}>Enviar proposta</button></form>`)}${card('Mural público',S.events.filter(x=>x.territory===S.territory&&(x.status==='validado'||(U()&&(x.author===S.current||canReview(x.territory))))).map(x=>`<div class="item"><b>${E(x.title)}</b> ${tag(x.status)}<p>${E(x.text)}</p>${canReview()&&x.author!==S.current&&x.status==='pendente'?`<button onclick="openApproval('${localFor(x.territory)}')">Revisar comunicado</button>`:''}</div>`).join('')||empty)}</div>${opinion('comunidade')}`;
else if(page==='relatorios')body=head('Evidência e auditoria','Impacto e transparência','Um registro único, múltiplas leituras. Ação validada não é automaticamente impacto ambiental.')+`<div class="grid four">${stat(S.actions.filter(active).length,'Entregas únicas validadas')}${stat(currentActions().filter(active).length,'Entregas no território')}${stat(S.actions.filter(a=>a.status==='pendente').length,'Aguardando pares')}${stat(S.closes.length,'Ciclos fechados')}</div><div class="grid">${card('Dimensões de impacto',`<p><b>Ambiental:</b> área recuperada, fauna, erosão, baseline e acompanhamento.</p><p><b>Social/cultural:</b> capacitação, horas remuneradas, autoria e memória.</p><p><b>Econômica:</b> recursos aplicados, renda local, compras e retorno fiscal estimado.</p><p><b>Governança:</b> proveniência, validação, contratos e prestação de contas.</p>`)}${card('Trilha de auditoria (local)',S.history.slice().reverse().map(h=>`<div class="item"><b>${E(h.type)}</b><p class="muted">${h.date} · ${E(h.detail)}</p></div>`).join('')||empty)}</div><button onclick="exportData()">Exportar JSON da demo</button> <button onclick="print()">Imprimir relatório</button>`;else{page='home';navParent=null;return render()}
$('#app').innerHTML='<div class="shell"><aside class="side"><div class="logo">'+logo+'<span>ARESTA<span class="smallbrand">INTELLIGENCE</span></span></div><nav class="nav" aria-label="Menu principal">'+navGroups.map(([p,l,i])=>'<button type="button" class="'+(groupOf(page)===p?'active':'')+'" '+(groupOf(page)===p?'aria-current="page"':'')+' onclick="navigate(\''+p+'\')">'+ico(i)+E(l)+'</button>').join('')+'</nav><div class="side-note"><div class="label">Conhecimento aberto</div><p style="font-size:12px;color:#C3C1B9">Autonomia · mínimo impacto · transparência</p><button type="button" onclick="showEcosystem()">O que é o Aresta?</button></div></aside><main class="main"><div class="top"><button type="button" class="context-button" onclick="navigate(\'territorio\')">'+ico('pin')+E(t.name)+'</button><div class="row">'+themeButtons()+'<span class="tag neutral">'+S.date+' · demo</span><button onclick="navigate(\'perfil\')" class="row"><span class="avatar">'+(u?E(u.name[0]):'+')+'</span>'+(u?E(u.name)+' · '+xp()+' XP':'Criar perfil / entrar')+'</button></div></div><div class="demo">V5.1 · LAB DE TESTES · Dados fictícios isolados da versão aprovada. Sem conexão com produção.</div>'+(page!==groupOf(page)?'<div class="crumb"><button type="button" onclick="navigate(\''+groupOf(page)+'\')">← '+E(navGroups.find(g=>g[0]===groupOf(page))?.[1]||'Visão Geral')+'</button></div>':'')+(msg?'<div class="notice" role="status">'+E(msg)+'</div>':'')+welcomeCard()+body+'<div class="foot">Referências: <a href="https://github.com/aresta-climb/aresta_db" target="_blank" rel="noopener">ArestaDB</a> · <a href="https://github.com/aresta-climb/aresta_app" target="_blank" rel="noopener">Aresta Climb</a> · CBME · Plano 2026. <button class="compact" onclick="resetDemo()">Reiniciar teste</button></div></main></div>';bindForms();convertChoices();foldSecondary();mountWeather()}
function approveEvent(id){let e=S.events.find(x=>x.id===id);if(canReview()&&e&&e.author!==S.current&&e.status==='pendente'){e.status='validado';log('comunicado',id);flash('Comunicado validado localmente.')}}function bindForms(){for(let id of ['register','opinion','action','draftName','beta','request','okr','ledger','event','institutionCase','territorialContext']){let f=$('#'+id);if(!f)continue;f.onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f)),u=U(),menu=f.dataset.menu;if(id==='register'){let n={id:uid(),name:v.name.trim(),aff:v.aff,roles:['escalador'],support:false};if(!n.name)return;S.users.push(n);personaSelected=null;S.current=n.id;return flash('Perfil criado neste navegador.')}if(!u)return;if(id==='territorialContext'){if(!saveTerritorialContext(v))return flash('Informe fonte e abra rascunho editável.');return flash('Contexto salvo para revisão. Nota e XP não alterados.')}if(id==='institutionCase'){if(!submitInstitutionCase(v))return flash('Proposta não registrada: revise destino, campos e limite do ciclo.');return flash('Proposta enviada à fila institucional.')}if(id==='opinion'){if(countOpinion(menu)>=maxActions())return;S.opinions.push({id:uid(),author:u.id,territory:S.territory,menu,text:v.text,date:S.date})}if(id==='action'){if(!canSubmit(menu)||!T[v.host])return;let k=kinds.find(x=>x[0]===v.kind&&x[3]===menu);if(!k)return;S.actions.push({id:uid(),author:u.id,origin:u.aff,entity:u.entity||null,territory:v.host,kind:k[0],menu,weight:k[1],description:v.description,evidence:v.evidence,status:'pendente',date:S.date})}if(id==='draftName'){let d=selectedDraft();if(d?.author!==u.id||d.status!=='rascunho')return;Object.assign(d,v)}if(id==='beta'){let d=selectedDraft();if(d?.author!==u.id||d.status!=='rascunho')return;d.betas.push({id:uid(),link:v.link,state:'pendente'})}if(id==='request'){let min={curador:3,mantenedor:5,autonomia:8}[v.role];if(xp()<min)return flash('XP insuficiente para essa solicitação experimental.');S.requests.push({id:uid(),author:u.id,territory:S.territory,role:v.role,evidence:v.evidence,support:!!v.support,status:'pendente'})}if(id==='okr'){if(!u.entity)return;S.okrs.push({id:uid(),author:u.id,entity:u.entity,text:v.text,evidence:v.evidence,status:'pendente',date:S.date})}if(id==='ledger'){if(!u.entity)return;let value=+v.value;if(!Number.isFinite(value)||value<=0)return;let balance=S.ledger.reduce((s,l)=>s+(l.type==='entrada'?l.value:-l.value),0);if(v.type==='saida'&&value>balance)return flash('Saldo simulado insuficiente.');S.ledger.push({...v,id:uid(),value,date:S.date,author:u.id})}if(id==='event'){if(countOpinion('comunidade')>=maxActions())return;S.events.push({...v,id:uid(),author:u.id,territory:S.territory,status:'pendente',date:S.date});S.opinions.push({id:uid(),author:u.id,territory:S.territory,menu:'comunidade',text:'Proposta: '+v.title,date:S.date})}log(id,'Registro local');flash('Registro salvo na demonstração.')}}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({demo:true,...S},null,2)],{type:'application/json'}));a.download='aresta-intelligence-test.json';a.click();URL.revokeObjectURL(a.href)}function resetDemo(){if(confirm('Apagar apenas os dados deste laboratório de testes?')){S=fresh();draftId=null;save();navigate('home')}}window.addEventListener('hashchange',()=>{let a=location.hash.slice(1).split('/'),p=a.at(-1),g=a.length===2?a[0]:null;if(p&&(p!==page||g!==navParent)){page=p;navParent=g;render()}});render();
</script></body></html>
